# Local or single-server deployment: docker compose up -d --build   ->  http://localhost:8080
services:
  app:
    build: .
    image: autoscalesim-lab:latest
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      SIM_HEAP: 1g
      # To use PostgreSQL (e.g. Amazon RDS) instead of the built-in SQLite file, set:
      # DATABASE_URL: jdbc:postgresql://<host>:5432/<db>
      # DB_USER: <user>
      # DB_PASSWORD: <password>
    volumes:
      - appdata:/data
    restart: unless-stopped
volumes:
  appdata:
